# Copyright NU Cybernetics. p(DOOM) — research prototype.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:jsonschema && git diff --exit-code -- data/schemas
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @pdoom/web build
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: true }
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Validate committed snapshot and audit chain
        run: |
          SNAP=$(ls -d data/snapshots/snap-* | sort | tail -1)
          go run ./cmd/pdoomctl snapshot validate "$SNAP"
          test -f data/audit/audit.jsonl && go run ./cmd/pdoomctl audit verify data/audit/audit.jsonl || true
  e2e:
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @pdoom/web build
      - run: PDOOM_CHROMIUM= pnpm e2e
        env:
          CI: "1"
